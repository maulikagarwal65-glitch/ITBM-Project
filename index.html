    function App() {
      const [city, setCity] = useState('Bengaluru');
      const [pincode, setPincode] = useState('560038');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [sortOption, setSortOption] = useState('best_deal');
      const [isBasketOpen, setIsBasketOpen] = useState(false);
      
      // Default basket pre-seeded with 2 items for demonstration
      const [basket, setBasket] = useState([
        { ...PRODUCTS_DATA[0], qty: 1 },
        { ...PRODUCTS_DATA[15], qty: 1 }
      ]);

      const pinNum = parseInt(pincode, 10) || 560038;
      const isSurge = pinNum % 2 !== 0;
      const extraMins = isSurge ? 3 : 0;

      // Filter and Sort Products
      const filteredProducts = useMemo(() => {
        let list = PRODUCTS_DATA;

        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase().trim();
          list = list.filter(p => 
            p.name.toLowerCase().includes(q) || 
            p.brand.toLowerCase().includes(q) ||
            p.category.toLowerCase().includes(q)
          );
        }

        if (selectedCategory !== 'all') {
          list = list.filter(p => p.category.toLowerCase() === selectedCategory.toLowerCase());
        }

        return list.map(item => {
          let lowest = Infinity;
          let bestStore = 'zepto';
          Object.entries(item.prices).forEach(([st, pr]) => {
            if (pr < lowest) {
              lowest = pr;
              bestStore = st;
            }
          });

          let fastestTime = Infinity;
          let fastestStore = 'blinkit';
          Object.entries(item.delivery).forEach(([st, tm]) => {
            const trueTime = tm + extraMins;
            if (trueTime < fastestTime) {
              fastestTime = trueTime;
              fastestStore = st;
            }
          });

          const discountPercent = Math.round(((item.mrp - lowest) / item.mrp) * 100);
          return {
            ...item,
            lowestPrice: lowest,
            bestStore,
            fastestTime,
            fastestStore,
            discountPercent
          };
        }).sort((a, b) => {
          if (sortOption === 'best_deal') return b.discountPercent - a.discountPercent;
          if (sortOption === 'lowest_price') return a.lowestPrice - b.lowestPrice;
          if (sortOption === 'fastest') return a.fastestTime - b.fastestTime;
          return 0;
        });
      }, [searchQuery, selectedCategory, sortOption, extraMins]);

      // Smart Basket Handlers
      const addToBasket = (product) => {
        setBasket(prev => {
          const idx = prev.findIndex(item => item.id === product.id);
          if (idx > -1) {
            const updated = [...prev];
            updated[idx].qty += 1;
            return updated;
          }
          return [...prev, { ...product, qty: 1 }];
        });
        setIsBasketOpen(true);
      };

      const updateQty = (id, delta) => {
        setBasket(prev => prev.map(item => {
          if (item.id === id) {
            const q = item.qty + delta;
            return q > 0 ? { ...item, qty: q } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const removeItem = (id) => {
        setBasket(prev => prev.filter(item => item.id !== id));
      };

      // Cumulative Basket Calculations for all 5 Stores
      const basketStoreTotals = useMemo(() => {
        const totals = { blinkit: 0, zepto: 0, instamart: 0, bb: 0, flipkart: 0 };
        basket.forEach(item => {
          Object.keys(totals).forEach(k => {
            totals[k] += (item.prices[k] || 0) * item.qty;
          });
        });

        const fees = {
          blinkit: { handling: 4, delivery: totals.blinkit > 199 ? 0 : 16 },
          zepto: { handling: 5, delivery: totals.zepto > 199 ? 0 : 15 },
          instamart: { handling: 6, delivery: totals.instamart > 199 ? 0 : 20 },
          bb: { handling: 3, delivery: totals.bb > 199 ? 0 : 12 },
          flipkart: { handling: 4, delivery: totals.flipkart > 199 ? 0 : 15 }
        };

        const surgeFee = isSurge ? 10 : 0;
        const finalTotals = {
          blinkit: totals.blinkit + fees.blinkit.handling + fees.blinkit.delivery + surgeFee,
          zepto: totals.zepto + fees.zepto.handling + fees.zepto.delivery + surgeFee,
          instamart: totals.instamart + fees.instamart.handling + fees.instamart.delivery + surgeFee,
          bb: totals.bb + fees.bb.handling + fees.bb.delivery + surgeFee,
          flipkart: totals.flipkart + fees.flipkart.handling + fees.flipkart.delivery + surgeFee
        };

        let lowestStore = 'zepto';
        let lowestTotal = Infinity;
        Object.entries(finalTotals).forEach(([k, tot]) => {
          if (tot < lowestTotal) {
            lowestTotal = tot;
            lowestStore = k;
          }
        });

        return { totals, fees, finalTotals, lowestStore, lowestTotal };
      }, [basket, isSurge]);

      // Trigger Lucide icons refresh on DOM update
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const totalItemsCount = basket.reduce((sum, item) => sum + item.qty, 0);

      const storeNames = {
        blinkit: 'Blinkit',
        zepto: 'Zepto',
        instamart: 'Swiggy Instamart',
        bb: 'BigBasket BB Now',
        flipkart: 'Flipkart Minutes'

      return (

            <div className="max-w-7xl mx-auto px-4 py-2 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center text-xs gap-1.5 font-bold">
              <div className="flex items-center gap-2">
                {isSurge ? (

                <span>Showing real-time stock & delivery speeds for <strong>{city} ({pincode})</strong></span>
              </div>
              <div className="flex items-center gap-4 text-[11px] text-slate-500 font-medium">
                <span className="flex items-center gap-1 text-slate-700 font-bold">
                  <i data-lucide="zap" className="w-3.5 h-3.5 fill-amber-500 text-amber-500"></i> 5 of 5 Dark Stores Online
                </span>
                <span className="flex items-center gap-1 text-slate-700 font-bold">
                  <i data-lucide="clock" className="w-3.5 h-3.5 text-emerald-600"></i> Avg Delivery: {isSurge ? '11-14 mins' : '7-10 mins'}
                </span>
              </div>
            </div>
          </div>

          {/* Main Workspace */}
          <main className="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8 flex-1 w-full space-y-7">
            
            {/* Hero Banner */}
            <div className="bg-gradient-to-r from-emerald-600 via-teal-600 to-emerald-700 text-white p-6 sm:p-8 rounded-3xl shadow-xl space-y-2">
              <span className="text-[10px] font-black uppercase tracking-widest bg-amber-400 text-slate-950 px-2.5 py-1 rounded-full inline-block">
                Fair Price Transparency
              </span>
              <h1 className="text-2xl sm:text-4xl font-black tracking-tight leading-tight">
                Compare Blinkit, Zepto, Swiggy Instamart, BB Now & Flipkart Minutes.
              </h1>
              <p className="text-xs sm:text-sm text-emerald-100 max-w-2xl font-medium leading-relaxed">
                Scan shelf prices against un-manipulated <strong>Fair Price</strong> benchmarks. Detect hidden platform fees, surge markups, and calculate cumulative smart basket totals.
              </p>
            </div>

            {/* 3. Search and Category Filter Section */}
            <div className="space-y-4">
              <div className="flex flex-col sm:flex-row gap-3 items-stretch">
                <div className="relative flex-1">
                  <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                    <i data-lucide="search" className="w-5 h-5"></i>
                  </div>
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Search Amul milk, Aashirvaad atta, coffee, coke, maggi, oil, soap..."
                    className="w-full pl-12 pr-10 py-3.5 bg-white border border-slate-200 rounded-2xl text-sm font-bold text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 shadow-sm"
                  />
                  {searchQuery && (
                    <button
                      onClick={() => setSearchQuery('')}
                      className="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600"
                    >
                      <i data-lucide="x" className="w-4 h-4"></i>
                    </button>
                  )}
                </div>

                {/* Sort Option */}
                <div className="flex items-center gap-2 bg-white border border-slate-200 rounded-2xl px-4 py-2 shadow-sm text-xs font-bold text-slate-700">
                  <i data-lucide="sliders-horizontal" className="w-4 h-4 text-emerald-600"></i>
                  <span className="text-slate-400 font-extrabold uppercase text-[10px]">Sort:</span>
                  <select
                    value={sortOption}
                    onChange={(e) => setSortOption(e.target.value)}
                    className="bg-transparent font-bold outline-none cursor-pointer"
                  >
                    <option value="best_deal">Highest % Discount</option>
                    <option value="lowest_price">Lowest Price (₹)</option>
                    <option value="fastest">Fastest Delivery (Mins)</option>
                  </select>
                </div>
              </div>

              {/* 6 Category Filter Chips */}
              <div className="flex items-center gap-2 overflow-x-auto pb-1 scrollbar-none">
                {CATEGORIES.map(cat => {
                  const isActive = selectedCategory.toLowerCase() === cat.id.toLowerCase();
                  return (
                    <button
                      key={cat.id}
                      onClick={() => setSelectedCategory(cat.id)}
                      className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition border ${
                        isActive
                          ? 'bg-emerald-600 text-white border-emerald-600 shadow-md shadow-emerald-600/20'
                          : 'bg-white text-slate-600 border-slate-200 hover:border-emerald-500'
                      }`}
                    >
                      {cat.label}
                    </button>
                  );
                })}
              </div>

              <div className="flex justify-between items-center text-xs text-slate-500 font-semibold px-1">
                <span>Showing <strong>{filteredProducts.length}</strong> grocery products</span>
                <span className="text-[11px] text-emerald-600 font-bold flex items-center gap-1">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  Verified Indian Retail Index
                </span>
              </div>
            </div>

            {/* 4. Platform Comparison Matrix Grid */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              {filteredProducts.map(product => {
                const { mrp, fairPrice, fairPriceNote, lowestPrice, bestStore, fastestStore, size, unitPrice } = product;
                const diffFromFair = lowestPrice - fairPrice;
                const isAuthenticDiscount = lowestPrice < fairPrice - 2;
                const isSurgeMarkedUp = lowestPrice > fairPrice + 3 || lowestPrice >= mrp;

                return (
                  <div key={product.id} className="bg-white border border-slate-200 rounded-3xl p-5 shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col justify-between group">
                    <div>
                      {/* Product Top Info */}
                      <div className="flex gap-4 items-start">
                        <div className="relative w-24 h-24 rounded-2xl overflow-hidden bg-slate-100 flex-shrink-0 border border-slate-100">
                          <img src={product.image} alt={product.name} className="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
                          {mrp > lowestPrice && (
                            <span className="absolute top-1.5 left-1.5 bg-rose-600 text-white text-[9px] font-black px-1.5 py-0.5 rounded shadow-sm">
                              {product.discountPercent}% OFF
                            </span>
                          )}
                        </div>

                        <div className="flex-1 min-w-0">
                          <div className="flex items-center gap-2 mb-1">
                            <span className="text-[10px] font-black text-slate-700 bg-slate-100 px-2 py-0.5 rounded uppercase tracking-wider">
                              {product.brand}
                            </span>
                            <span className="text-[11px] font-bold text-slate-500">{size}</span>
                            {unitPrice && (
                              <span className="text-[10px] font-semibold text-emerald-700 bg-emerald-50 px-1.5 py-0.5 rounded">
                                {unitPrice}
                              </span>
                            )}
                          </div>

                          <h3 className="font-extrabold text-slate-900 text-sm sm:text-base leading-snug line-clamp-2">
                            {product.name}
                          </h3>

                          {/* Fair Price & Deal Integrity Engine */}
                          <div className="mt-2.5 p-2 bg-slate-50 rounded-xl border border-slate-200 flex flex-wrap items-center justify-between gap-1.5 text-xs">
                            <div className="flex items-center gap-2">
                              <span className="text-[11px] font-black text-slate-700">
                                Fair Price: <strong className="text-emerald-700">₹{fairPrice}</strong>
                              </span>
                              <span className="text-[11px] text-slate-400 line-through">MRP ₹{mrp}</span>
                            </div>

                            {/* Deal Integrity Badges */}
                            {isAuthenticDiscount ? (
                              <span className="inline-flex items-center gap-1 text-[10px] font-black text-emerald-800 bg-emerald-100 px-2 py-0.5 rounded-md border border-emerald-300/40">
                                <i data-lucide="check-circle" className="w-3 h-3 text-emerald-600"></i> Authentic Discount
                              </span>
                            ) : isSurgeMarkedUp ? (
                              <span className="inline-flex items-center gap-1 text-[10px] font-black text-rose-800 bg-rose-100 px-2 py-0.5 rounded-md border border-rose-300/40">
                                <i data-lucide="alert-circle" className="w-3 h-3 text-rose-600"></i> Surge / Marked Up
                              </span>
                            ) : (
                              <span className="inline-flex items-center gap-1 text-[10px] font-black text-blue-800 bg-blue-100 px-2 py-0.5 rounded-md border border-blue-300/40">
                                <i data-lucide="shield-check" className="w-3 h-3 text-blue-600"></i> Fair Market Value
                              </span>
                            )}
                          </div>

                          {fairPriceNote && (
                            <p className="text-[9px] text-slate-400 mt-1 flex items-center gap-1">
                              <i data-lucide="info" className="w-3 h-3 flex-shrink-0 text-slate-400"></i> {fairPriceNote}
                            </p>
                          )}
                        </div>
                      </div>

                      {/* 5-Store Comparison Matrix */}
                      <div className="mt-4 pt-4 border-t border-slate-100">
                        <span className="text-[10px] font-extrabold uppercase tracking-wider text-slate-400 block mb-2">
                          Live 5-Store Price & Delivery Comparison
                        </span>

                        <div className="grid grid-cols-2 sm:grid-cols-5 gap-2">
                          {PLATFORMS.map(p => {
                            const price = product.prices[p.key];
                            const time = product.delivery[p.key] + extraMins;
                            const inStock = product.stock[p.key] !== false;
                            const isBest = p.key === bestStore;
                            const isFastest = p.key === fastestStore;
                            
                            const deepLink = p.key === 'blinkit' ? `https://blinkit.com/s/?q=${encodeURIComponent(product.name)}&pincode=${pincode}` :
                                             p.key === 'zepto' ? `https://www.zeptonow.com/search?query=${encodeURIComponent(product.name)}&pincode=${pincode}` :
                                             p.key === 'instamart' ? `https://www.swiggy.com/instamart/search?query=${encodeURIComponent(product.name)}` :
                                             p.key === 'bb' ? `https://www.bigbasket.com/ps/?q=${encodeURIComponent(product.name)}` :
                                             `https://www.flipkart.com/search?q=${encodeURIComponent(product.name)}`;

                            return (
                              <div
                                key={p.key}
                                className={`p-2.5 rounded-2xl border transition flex flex-col justify-between ${
                                  isBest 
                                    ? 'bg-emerald-50/70 border-emerald-500 ring-2 ring-emerald-500/20 shadow-sm' 
                                    : 'bg-slate-50 border-slate-200'
                                }`}
                              >
                                <div className="flex items-center justify-between mb-1.5">
                                  <span className={`text-[9px] font-black uppercase px-1.5 py-0.5 rounded ${p.color}`}>
                                    {p.name}
                                  </span>
                                  {isBest ? (
                                    <span className="text-[9px] font-black text-emerald-800 bg-emerald-200 px-1 rounded flex items-center gap-0.5">
                                      <i data-lucide="tag" className="w-2.5 h-2.5"></i> Best Deal
                                    </span>
                                  ) : isFastest ? (
                                    <span className="text-[9px] font-black text-amber-700 bg-amber-100 px-1 rounded flex items-center gap-0.5">
                                      <i data-lucide="zap" className="w-2.5 h-2.5 fill-amber-500 text-amber-500"></i> Fastest
                                    </span>
                                  ) : null}
                                </div>

                                <div className="my-1">
                                  <div className="text-base font-black text-slate-900">₹{price}</div>
                                  <div className="text-[10px] text-slate-500 font-semibold">{time} mins</div>
                                  <div className="text-[9px] mt-0.5 font-bold">
                                    {inStock ? (
                                      <span className="text-emerald-600">● In Stock</span>
                                    ) : (
                                      <span className="text-slate-400">○ Low / OOS</span>
                                    )}
                                  </div>
                                </div>

                                <a
                                  href={deepLink}
                                  target="_blank"
                                  rel="noopener noreferrer"
                                  className="mt-2 w-full py-1 px-1.5 rounded-lg bg-white hover:bg-slate-900 hover:text-white text-slate-700 font-bold text-[10px] border border-slate-200 transition flex items-center justify-center gap-1"
                                >
                                  Order Now <i data-lucide="external-link" className="w-2.5 h-2.5"></i>
                                </a>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    </div>

                    {/* Add to Smart Basket Action */}
                    <div className="mt-4 pt-3 border-t border-slate-100">
                      <button
                        onClick={() => addToBasket(product)}
                        className="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-extrabold text-xs rounded-xl transition duration-150 flex items-center justify-center gap-1.5 shadow-sm"
                      >
                        <i data-lucide="plus" className="w-4 h-4"></i> Add to Smart Basket
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>

          </main>

          {/* 5. Smart Basket Multi-Product Optimizer Modal */}
          {isBasketOpen && (
            <div className="fixed inset-0 z-50 overflow-hidden bg-slate-950/70 backdrop-blur-sm flex justify-end">
              <div className="w-full max-w-lg bg-white h-full shadow-2xl flex flex-col justify-between border-l border-slate-200">
                
                {/* Drawer Header */}
                <div className="p-5 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                  <div className="flex items-center gap-2.5">
                    <div className="bg-emerald-600 text-white p-2 rounded-xl">
                      <i data-lucide="shopping-bag" className="w-5 h-5"></i>
                    </div>
                    <div>
                      <h3 className="text-base font-black text-slate-900">Smart Basket Optimizer</h3>
                      <p className="text-[11px] text-slate-400 font-bold">{basket.length} items • Cumulative store checkout</p>
                    </div>
                  </div>

                  <div className="flex items-center gap-2">
                    {basket.length > 0 && (
                      <button onClick={() => setBasket([])} className="text-[11px] font-bold text-slate-400 hover:text-rose-500 px-2 py-1">
                        Clear
                      </button>
                    )}
                    <button onClick={() => setIsBasketOpen(false)} className="p-1.5 rounded-xl text-slate-400 hover:text-slate-600 bg-white border border-slate-200">
                      <i data-lucide="x" className="w-5 h-5"></i>
                    </button>
                  </div>
                </div>

                {/* Items List */}
                <div className="flex-1 overflow-y-auto p-5 space-y-3">
                  {basket.length === 0 ? (
                    <div className="text-center py-16 space-y-3 text-slate-400">
                      <i data-lucide="shopping-bag" className="w-12 h-12 mx-auto text-slate-300"></i>
                      <p className="text-sm font-bold text-slate-700">Your basket is empty.</p>
                      <p className="text-xs">Add products from the catalog to compare total landed checkout prices across stores.</p>
                    </div>
                  ) : (
                    basket.map(item => {
                      const minPrice = Math.min(...Object.values(item.prices));
                      return (
                        <div key={item.id} className="flex items-center justify-between p-3.5 bg-slate-50 border border-slate-200 rounded-2xl gap-3">
                          <img src={item.image} alt={item.name} className="w-12 h-12 rounded-xl object-cover" />
                          <div className="flex-1 min-w-0">
                            <h4 className="text-xs font-extrabold text-slate-900 truncate">{item.name}</h4>
                            <p className="text-[10px] text-slate-400 font-semibold">{item.size} • Best: ₹{minPrice}</p>
                          </div>
                          <div className="flex items-center gap-1.5">
                            <button onClick={() => updateQty(item.id, -1)} className="w-7 h-7 rounded-lg bg-white border border-slate-200 flex items-center justify-center font-bold text-slate-700 hover:bg-rose-50 hover:text-rose-600">
                              -
                            </button>
                            <span className="w-6 text-center font-black text-xs text-slate-900">{item.qty}</span>
                            <button onClick={() => updateQty(item.id, 1)} className="w-7 h-7 rounded-lg bg-white border border-slate-200 flex items-center justify-center font-bold text-slate-700 hover:bg-emerald-50 hover:text-emerald-600">
                              +
                            </button>
                            <button onClick={() => removeItem(item.id)} className="p-1.5 text-slate-400 hover:text-rose-500 ml-1">
                              <i data-lucide="trash-2" className="w-4 h-4"></i>
                            </button>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>

                {/* Landed Store Matrix & Summary */}
                {basket.length > 0 && (
                  <div className="p-5 border-t border-slate-200 bg-slate-50 space-y-4">
                    <div>
                      <span className="text-[10px] font-black uppercase tracking-wider text-slate-400 block mb-2">
                        Cumulative Landed Cart Totals (Fees Included)
                      </span>
                      <div className="grid grid-cols-5 gap-1.5 text-center text-xs">
                        {PLATFORMS.map(p => {
                          const tot = basketStoreTotals.finalTotals[p.key];
                          const isLowest = p.key === basketStoreTotals.lowestStore;
                          return (
                            <div key={p.key} className={`p-2 rounded-xl border transition ${
                              isLowest ? 'bg-emerald-100 border-emerald-500 font-black ring-1 ring-emerald-500' : 'bg-white border-slate-200'
                            }`}>
                              <span className={`text-[8px] font-black uppercase px-1 py-0.5 rounded ${p.color}`}>
                                {p.name}
                              </span>
                              <div className="text-xs font-black text-slate-900 mt-1">₹{tot}</div>
                              <span className="text-[9px] text-slate-400 font-bold block">
                                {basketStoreTotals.fees[p.key].delivery === 0 ? 'Free Del' : `+₹${basketStoreTotals.fees[p.key].delivery}`}
                              </span>
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    {/* Recommendation Banner */}
                    <div className="bg-emerald-600 text-white p-4 rounded-2xl shadow-lg shadow-emerald-600/20 space-y-1">
                      <div className="flex items-center gap-2">
                        <i data-lucide="check-circle-2" className="w-4 h-4 text-emerald-200"></i>
                        <span className="text-xs font-extrabold uppercase tracking-wider text-emerald-100">
                          Lowest Single Store Match
                        </span>
                      </div>
                      <div className="flex justify-between items-baseline">
                        <h4 className="text-base font-black">{storeNames[basketStoreTotals.lowestStore]}</h4>
                        <span className="text-xl font-black">₹{basketStoreTotals.lowestTotal}</span>
                      </div>
                      <p className="text-[10px] text-emerald-100">
                        Includes ₹{basketStoreTotals.fees[basketStoreTotals.lowestStore].handling} platform fee + {basketStoreTotals.fees[basketStoreTotals.lowestStore].delivery === 0 ? 'FREE delivery' : `₹${basketStoreTotals.fees[basketStoreTotals.lowestStore].delivery} delivery fee`}.
                      </p>
                    </div>

                    <button
                      onClick={() => alert(`🎉 Order placed via ${storeNames[basketStoreTotals.lowestStore]} for ₹${basketStoreTotals.lowestTotal}! Directing to doorstep dispatch...`)}
                      className="w-full py-3.5 bg-slate-900 hover:bg-slate-800 text-white font-black text-sm rounded-xl transition shadow-xl shadow-slate-900/10 flex items-center justify-center gap-2"
                    >
                      <i data-lucide="truck" className="w-4 h-4"></i> Order with Lowest Store ({storeNames[basketStoreTotals.lowestStore]})
                    </button>
                  </div>
                )}

              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-slate-950 text-slate-500 py-10 text-center text-xs border-t border-slate-900 mt-auto">
            <div className="max-w-7xl mx-auto px-4 space-y-3">
              <p className="font-black text-slate-300 text-sm">BuyWise Co. • India Quick-Commerce Price Index</p>
              <p className="text-slate-500 text-[11px] max-w-xl mx-auto">
                All trademarks, logos, and product brand vectors (Blinkit, Zepto, Swiggy Instamart, BigBasket, Flipkart Minutes) belong to their respective owners. Fair Price metrics are calculated from official brand MRPs and un-surged retail distribution standards.
              </p>
              <p className="text-slate-600 text-[10px]">© 2026 BuyWise Co. All rights reserved.</p>
            </div>
          </footer>

        </div>
      );
    }

    // Render the React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

</body>
</html>
